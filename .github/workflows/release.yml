name: Release

# Builds the iPhone and Mac apps and attaches them to a GitHub Release when a version tag
# is pushed (for example v1.2.0). The builds are not signed with an Apple team:
#   - GroundKit-iOS-unsigned.ipa must be re-signed before it installs (Sideloadly, AltStore).
#   - GroundKit-macOS.zip is signed to run locally; macOS asks once before opening it.
# It then updates the Homebrew cask, so `brew install --cask watanaberyunosuke/tap/groundkit`
# installs the new version.
# Run it by hand from the Actions tab to build without publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # The project needs Xcode 26 or later (Swift 6.2, MainActor by default).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      # A tag v1.2.0 sets the version to 1.2.0; the run number is the build number. A
      # manual run keeps the version in the project.
      - name: Version
        id: version
        run: |
          settings="CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not a version such as v1.2.0"
              exit 1
            fi
            settings="$settings MARKETING_VERSION=$version"
          fi
          echo "settings=$settings" >> "$GITHUB_OUTPUT"

      - name: Archive (iPhone, unsigned)
        run: |
          xcodebuild archive \
            -project GroundKit.xcodeproj \
            -scheme GroundKit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/GroundKit-iOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            ${{ steps.version.outputs.settings }} \
            -quiet

      - name: Archive (Mac, signed to run locally)
        run: |
          xcodebuild archive \
            -project GroundKit.xcodeproj \
            -scheme GroundKit \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/GroundKit-macOS.xcarchive \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ${{ steps.version.outputs.settings }} \
            -quiet

      # An .ipa is a zip with the app inside a Payload folder.
      - name: Package
        run: |
          mkdir -p dist build/Payload
          cp -R build/GroundKit-iOS.xcarchive/Products/Applications/GroundKit.app build/Payload/
          (cd build && zip -qry ../dist/GroundKit-iOS-unsigned.ipa Payload)
          ditto -c -k --keepParent \
            build/GroundKit-macOS.xcarchive/Products/Applications/GroundKit.app \
            dist/GroundKit-macOS.zip
          ls -la dist

      - name: Keep the builds
        uses: actions/upload-artifact@v4
        with:
          name: GroundKit-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*

      # Re-running a tag's workflow replaces the files on its existing release.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            cat > notes.md <<'EOF'
          These builds are not signed with an Apple developer team.

          - **Mac with Homebrew:** `brew trust watanaberyunosuke/tap`, then `brew install --cask watanaberyunosuke/tap/groundkit`.
          - **Mac without Homebrew (GroundKit-macOS.zip):** unzip and open GroundKit. If macOS says it cannot check the app, open System Settings > Privacy & Security and choose Open Anyway.
          - **iPhone (GroundKit-iOS-unsigned.ipa):** re-sign and install it with Sideloadly or AltStore, or build from Xcode.
          EOF
            gh release create "$TAG" dist/* \
              --title "GroundKit ${TAG#v}" \
              --notes-file notes.md \
              --generate-notes
          fi

      # Points the Homebrew cask (watanaberyunosuke/homebrew-tap) at the new Mac zip.
      # Needs a HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read and
      # write on the tap repository only. Without it the step is skipped.
      - name: Update the Homebrew tap
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated"
            exit 0
          fi
          version="${TAG#v}"
          sha=$(shasum -a 256 dist/GroundKit-macOS.zip | cut -d' ' -f1)
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/watanaberyunosuke/homebrew-tap.git" tap
          cd tap
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" \
            Casks/groundkit.rb
          if git diff --quiet; then
            echo "The cask already points at ${version}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(groundkit): update to ${version}"
          git push -q origin HEAD:main
